# =====================================================================
# Tema de la aplicación (claro, ciruela/orquídea + rosa fucsia)
# =====================================================================
# Ubicación: <raíz del proyecto>/.streamlit/config.toml
# (la carpeta desde la que ejecutas `streamlit run`).
#
# Diseñado para un Solver de Programación Lineal:
#   - Fondos limpios y luminosos (blanco rosado suave) para leer bien
#     restricciones, matrices, tablas Simplex y bloques de código.
#   - Morado ciruela/orquídea (#882DEC / #9333EA) + rosa vibrante (#FC2C7F)
#     como identidad principal, evitando el morado azulado "chillón".
#   - Gráficas con alto contraste para distinguir rectas de restricción,
#     región factible y vector gradiente / función objetivo.

[theme]
base = "light"

# --- Colores principales ----------------------------------------------
primaryColor = "#D92672"              # Rosa frambuesa intenso (botones primarios con texto blanco legible)
backgroundColor = "#FFFBFD"           # Fondo general blanco con sutil calidez rosada
secondaryBackgroundColor = "#FCEEF5"  # Tarjetas, inputs, tablas Simplex, expanders
textColor = "#24112B"                 # Texto principal (ciruela casi negro, menos duro que #000)
linkColor = "#882DEC"                 # Enlaces y acentos secundarios en morado vibrante
borderColor = "#F3D1E4"               # Bordes sutiles rosado-malva
codeBackgroundColor = "#F9E6F0"       # Fondo de `código` y fórmulas matemáticas

# --- Forma y tipografía -----------------------------------------------
baseRadius = "0.6rem"                 # Esquinas redondeadas en todos los componentes
showWidgetBorder = true               # Borde visible en inputs sin foco
font = "sans-serif"                   # También: "serif", "monospace" o una fuente de Google Fonts

# --- Colores semánticos -----------------------------------------------
# Útiles para estados del solver (Óptimo encontrado, No acotado, Infactible).
blueColor = "#882DEC"                 # st.info en morado orquídea
greenColor = "#0D9488"                # st.success (solución óptima, verde azulado limpio)
orangeColor = "#D97706"               # st.warning (advertencias / degeneración)
redColor = "#E11D48"                  # st.error (problema infactible / no acotado)

# --- Gráficos ---------------------------------------------------------
# Inspirado en tu segunda paleta: ideal para graficar restricciones,
# región factible y función objetivo en 2D/3D con total claridad.
chartCategoricalColors = ["#FC2C7F", "#882DEC", "#E940EA", "#00AAE4", "#1C2EE7", "#0D9488", "#F59E0B"]

# --- Barra lateral ----------------------------------------------------
# Usa el tono pastel rosado (#FDE2E4 suavizado) para separar los
# parámetros del modelo (variables, tipo de optimización) del área de resultados.
[theme.sidebar]
backgroundColor = "#FDF2F7"
secondaryBackgroundColor = "#F9DFEC"
borderColor = "#F0C6DD"

# =====================================================================
# Variantes en modo claro (copia los valores sobre [theme])
